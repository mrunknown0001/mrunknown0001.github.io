<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="WMT — work management tool for tasks, projects, approvals and task cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1206"/>
      <stop offset="100%" stop-color="#2b2010"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">wmt · my work · in progress</text>
  </g>

  <!-- task rows with status chips -->
  <g>
    <rect x="640" y="392" width="420" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="640" y="392" width="7" height="40" rx="4" fill="#f59e0b" fill-opacity="0.8"/>
    <rect x="668" y="405" width="230" height="14" rx="7" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="946" y="403" width="92" height="18" rx="9" fill="#f59e0b" fill-opacity="0.35"/>

    <rect x="640" y="448" width="420" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="640" y="448" width="7" height="40" rx="4" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="668" y="461" width="188" height="14" rx="7" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="946" y="459" width="92" height="18" rx="9" fill="#38bdf8" fill-opacity="0.30"/>

    <rect x="640" y="504" width="420" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="640" y="504" width="7" height="40" rx="4" fill="#34d399" fill-opacity="0.8"/>
    <rect x="668" y="517" width="254" height="14" rx="7" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="946" y="515" width="92" height="18" rx="9" fill="#34d399" fill-opacity="0.30"/>

    <!-- delegation arrow: task handed to a stand-in and back -->
    <path d="M660,580 C740,616 900,616 1000,584" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M1000,584 l-16,-2 6,12 z" fill="#fbbf24" fill-opacity="0.75"/>
  </g>

  <text x="130" y="290" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="70" font-weight="700" fill="#ffffff">WMT</text>
  <text x="130" y="336" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#fcd34d">Work Management Tool</text>
  <rect x="130" y="364" width="86" height="5" rx="3" fill="#f59e0b"/>
  <text x="130" y="430" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#e2e8f0">Tasks, projects and approvals with automation</text>
  <text x="130" y="466" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#e2e8f0">rules, custom fields and temporary task cover.</text>

  <text x="130" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fcd34d">Laravel · Inertia · React · MySQL · Redis</text>
  <text x="130" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fcd34d">Queues · WebSockets · Docker · PHPUnit</text>
</svg>
