<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="k6 load testing suite — performance baselines for Laravel APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120b20"/>
      <stop offset="100%" stop-color="#231636"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">k6 run --vus 200 --duration 5m</text>
  </g>

  <polyline points="130,520 210,470 290,495 370,410 450,440 530,360 610,395 690,300 770,330 850,250 930,280 1010,215"
            fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="130" y="305" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Load Testing Suite</text>
  <rect x="130" y="342" width="86" height="5" rx="3" fill="#a855f7"/>
  <text x="130" y="408" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#e9d5ff">Repeatable performance baselines and regression</text>
  <text x="130" y="448" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#e9d5ff">thresholds for Laravel APIs before they ship.</text>

  <text x="130" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#d8b4fe">k6 · JavaScript · Thresholds · CI-friendly reports</text>
</svg>
