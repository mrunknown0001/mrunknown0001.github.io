<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="MagicDrops — React, Express and Supabase operations platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f2733"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">~/projects/magicdrops</text>
  </g>

  <text x="130" y="315" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">MagicDrops</text>
  <rect x="130" y="352" width="86" height="5" rx="3" fill="#06b6d4"/>
  <text x="130" y="418" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#cbd5e1">Role-based operations platform with SMS/messaging</text>
  <text x="130" y="458" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#cbd5e1">webhooks and a hardened production deploy pipeline.</text>

  <text x="130" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#67e8f9">React · Vite · TypeScript · Express · Supabase</text>
  <text x="130" y="612" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#67e8f9">PostgreSQL · nginx · PM2 · Webhooks</text>
</svg>
