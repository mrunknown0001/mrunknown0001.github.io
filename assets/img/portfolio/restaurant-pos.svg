<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Restaurant POS and Inventory — orders, recipe-level stock and AI demand forecasting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b0f03"/>
      <stop offset="100%" stop-color="#33200c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">pos · floor · open tickets</text>
  </g>

  <!-- table / ticket tiles -->
  <g>
    <rect x="640" y="400" width="126" height="86" rx="12" fill="#fb923c" fill-opacity="0.28" stroke="#fb923c" stroke-opacity="0.45"/>
    <rect x="784" y="400" width="126" height="86" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="928" y="400" width="126" height="86" rx="12" fill="#fb923c" fill-opacity="0.28" stroke="#fb923c" stroke-opacity="0.45"/>
    <rect x="640" y="506" width="126" height="86" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="784" y="506" width="126" height="86" rx="12" fill="#fb923c" fill-opacity="0.28" stroke="#fb923c" stroke-opacity="0.45"/>
    <rect x="928" y="506" width="126" height="86" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>

  <text x="130" y="278" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="55" font-weight="700" fill="#ffffff">Restaurant POS</text>
  <text x="130" y="340" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="55" font-weight="700" fill="#ffffff">&amp; Inventory</text>
  <rect x="130" y="374" width="86" height="5" rx="3" fill="#fb923c"/>
  <text x="130" y="440" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#fed7aa">Orders, tables and recipe-level stock for cafés</text>
  <text x="130" y="478" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#fed7aa">and restaurants, with AI demand forecasting.</text>

  <text x="130" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fdba74">Laravel · Inertia · React · TypeScript · MySQL</text>
  <text x="130" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fdba74">Recipe costing · Stock deduction · Sales reports</text>
</svg>
