<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Online Clinic — appointments, patient records and consultations with AI-assisted intake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0710"/>
      <stop offset="100%" stop-color="#2e1224"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">clinic · today's schedule</text>
  </g>

  <!-- vitals trace -->
  <polyline points="640,470 700,470 720,430 745,515 770,455 800,470 880,470 900,438 925,510 950,462 980,470 1060,470"
            fill="none" stroke="#fb7185" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- appointment rows -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="640" y="546" width="420" height="24" rx="6"/>
    <rect x="640" y="582" width="360" height="24" rx="6"/>
  </g>
  <g fill="#f43f5e" fill-opacity="0.55">
    <rect x="640" y="546" width="8" height="24" rx="4"/>
    <rect x="640" y="582" width="8" height="24" rx="4"/>
  </g>

  <text x="130" y="290" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Online Clinic</text>
  <rect x="130" y="327" width="86" height="5" rx="3" fill="#f43f5e"/>
  <text x="130" y="393" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#fecdd3">Appointments, patient records and consultations,</text>
  <text x="130" y="431" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#fecdd3">with AI assisting intake and clinical notes.</text>

  <text x="130" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fda4af">Laravel · Inertia · React · TypeScript · MySQL</text>
  <text x="130" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#fda4af">Role-based access · Scheduling · AI intake</text>
</svg>
