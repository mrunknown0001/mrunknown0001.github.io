<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Sales Dashboard — Laravel and Livewire reporting dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031a17"/>
      <stop offset="100%" stop-color="#0a2f36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.95">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g>
    <rect x="80" y="110" width="1040" height="530" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="80" y1="176" x2="1120" y2="176" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="118" cy="143" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="143" r="7" fill="#febc2e"/>
    <circle cx="170" cy="143" r="7" fill="#28c840"/>
    <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8">sales · this month vs last</text>
  </g>

  <!-- trend area + line -->
  <path d="M640,560 L640,470 L710,430 L780,455 L850,385 L920,400 L990,330 L1060,290 L1060,560 Z" fill="url(#area)"/>
  <polyline points="640,470 710,430 780,455 850,385 920,400 990,330 1060,290"
            fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1060" cy="290" r="8" fill="#2dd4bf"/>

  <!-- bar sparks -->
  <g fill="#2dd4bf" fill-opacity="0.30">
    <rect x="640" y="600" width="46" height="26" rx="4"/>
    <rect x="702" y="588" width="46" height="38" rx="4"/>
    <rect x="764" y="596" width="46" height="30" rx="4"/>
    <rect x="826" y="572" width="46" height="54" rx="4"/>
    <rect x="888" y="580" width="46" height="46" rx="4"/>
    <rect x="950" y="558" width="46" height="68" rx="4"/>
    <rect x="1012" y="546" width="46" height="80" rx="4"/>
  </g>

  <text x="130" y="290" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Sales Dashboard</text>
  <rect x="130" y="327" width="86" height="5" rx="3" fill="#14b8a6"/>
  <text x="130" y="393" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#ccfbf1">Live sales, targets and product movement</text>
  <text x="130" y="431" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#ccfbf1">with scheduled reports straight to management.</text>

  <text x="130" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5eead4">Laravel · Livewire · MySQL · Charting</text>
  <text x="130" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5eead4">Scheduled reports · Role-based access</text>
</svg>
