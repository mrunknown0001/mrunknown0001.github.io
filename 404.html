<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>404 — Page not found | Michael Adam Trinidad</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0078ff">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Raleway:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0078ff;
      --bg: #0b1020;
      --fg: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(0, 120, 255, 0.35), transparent 60%),
        linear-gradient(135deg, #0b1020, #161d38);
      color: var(--fg);
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    h1 {
      font-family: "Raleway", sans-serif;
      font-size: clamp(64px, 18vw, 140px);
      font-weight: 700;
      margin: 8px 0 0 0;
      line-height: 1;
    }

    h2 {
      font-family: "Raleway", sans-serif;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      margin: 16px 0 0 0;
    }

    p {
      margin: 14px auto 0 auto;
      max-width: 480px;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 32px;
    }

    a.btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 50px;
      font-size: 15px;
      text-decoration: none;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
      transition: 0.3s;
    }

    a.btn.ghost {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--fg);
    }

    a.btn:hover { transform: translateY(-2px); }
  </style>
</head>

<body>
  <main>
    <p class="code">HTTP 404 · NOT FOUND</p>
    <h1>404</h1>
    <h2>That page doesn't exist</h2>
    <p>The link is broken, or the page has moved. Everything worth seeing is on the home page.</p>
    <div class="actions">
      <a class="btn" href="/">Back to home</a>
      <a class="btn ghost" href="/#portfolio">See my work</a>
      <a class="btn ghost" href="/#contact">Contact</a>
    </div>
  </main>
</body>

</html>
